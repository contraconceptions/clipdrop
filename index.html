<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipDrop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="titlebar-brand">
          <span class="titlebar-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 4V2.5A1.5 1.5 0 0 1 4.5 1h2M12 4V2.5A1.5 1.5 0 0 0 10.5 1h-2M3 11v1.5A1.5 1.5 0 0 0 4.5 14h2M12 11v1.5a1.5 1.5 0 0 1-1.5 1h-2M5 7.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
          <span class="titlebar-copy"><strong>ClipDrop</strong><small>LOCAL INDEX</small></span>
        </div>
        <nav id="nav" aria-label="Primary navigation">
          <button class="nav-btn active" data-page="intake">
            <b>01</b><span>Capture</span><kbd>⌘1</kbd>
          </button>
          <button class="nav-btn" data-page="dashboard">
            <b>02</b><span>Classify</span><kbd>⌘2</kbd>
          </button>
          <button class="nav-btn" data-page="browse">
            <b>03</b><span>Retrieve</span><kbd>⌘3</kbd>
          </button>
          <button class="nav-btn" data-page="settings">
            <b>04</b><span>Settings</span><kbd>⌘4</kbd>
          </button>
        </nav>
        <div class="window-actions"><div class="device-state"><i></i><span>ON-DEVICE</span></div><button id="compact-toggle" class="icon-btn" type="button" title="Switch to capture widget" aria-label="Switch to capture widget">⌄</button></div>
      </header>
      <div class="app-shell">
        <aside class="utility-rail" aria-label="Library summary">
          <div class="rail-count"><strong id="rail-total">—</strong><span>INDEXED ITEMS</span></div>
          <button class="rail-item active" data-page="intake"><span>⌑</span>Inbox</button>
          <button class="rail-item" data-page="dashboard"><span>◔</span>Processing</button>
          <button class="rail-item" data-page="browse"><span>▤</span>Library</button>
          <button class="rail-item" data-page="settings"><span>⚙</span>Settings</button>
          <div class="rail-rule"></div>
          <p class="rail-label">SAVED VIEWS</p>
          <span class="rail-static">□ Documents</span><span class="rail-static">▧ Images</span><span class="rail-static">⌘ Code</span><span class="rail-static">↗ Links</span>
          <div class="local-card"><strong>▣ LOCAL ONLY</strong><span>Index stored on this device.</span></div>
        </aside>
        <main id="page-container"></main>
      </div>
      <section id="capture-widget" aria-label="ClipDrop quick capture widget">
        <button class="widget-surface" id="widget-capture" type="button" aria-label="Choose files or drop content here">
          <span class="widget-mark">+</span>
          <span><strong>Drop or paste</strong><small>Click to choose files</small></span>
        </button>
        <div class="widget-actions">
          <button id="widget-paste" type="button" title="Paste clipboard" aria-label="Paste clipboard">▧</button>
          <button id="widget-library" type="button" title="Open library" aria-label="Open library">▤</button>
          <button id="widget-expand" type="button" title="Expand ClipDrop" aria-label="Expand ClipDrop">↗</button>
        </div>
      </section>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
